name: beyondfit monitor

on:
  # Staggered off the :00 mark to avoid GitHub's top-of-hour scheduling storm.
  # On free repos GitHub throttles cron, so real cadence is ~30–60 min.
  schedule:
    # Hourly check. monitor.py also emits a heartbeat summary every ~3h, gated
    # by elapsed time in state, so a skipped slot is covered by the next run.
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      summary:
        description: "Send a daily summary message this run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: beyondfit-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # One run does 4 checks 15 min apart (~45 min of wall-clock, mostly
    # sleeping), so the timeout must comfortably exceed that.
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # monitor.py auto-sends the heartbeat summary every ~3h. FORCE_SUMMARY
          # lets a manual dispatch send one on demand for testing.
          FORCE_SUMMARY: ${{ github.event.inputs.summary == 'true' && '1' || '0' }}
          # 4 checks, 15 min (900s) apart = full hourly coverage in one run.
          CHECKS_PER_RUN: "4"
          CHECK_INTERVAL_SECONDS: "900"
          # Stream logs live during the long run instead of buffering.
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p state
          python monitor.py

      - name: Commit and push updated state
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p state
          git add -A state

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update known_stock state [skip ci]"

          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed, retrying after pull --rebase ..."
            git pull --rebase --autostash || true
            sleep 2
          done

          echo "::error::Failed to push state after 3 attempts."
          exit 1
