name: beyondfit monitor

on:
  # Staggered off the :00 mark to avoid GitHub's top-of-hour scheduling storm.
  # On free repos GitHub throttles cron, so real cadence is ~30–60 min.
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beyondfit-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p state
          python monitor.py

      - name: Commit and push updated state
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p state
          git add -A state

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update known_stock state [skip ci]"

          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed, retrying after pull --rebase ..."
            git pull --rebase --autostash || true
            sleep 2
          done

          echo "::error::Failed to push state after 3 attempts."
          exit 1
